
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C2000 M.2 Pinout</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #111827;
  color: #e5e7eb;
  margin: 0;
  padding: 30px;
}

.container {
  max-width: 1050px;
  margin: auto;
}

h1 { color: white; }

.controls {
  display: flex;
  gap: 12px;
  margin: 20px 0;
}

select, input {
  padding: 10px;
  border-radius: 6px;
  border: 1px solid #475569;
  background: #1f2937;
  color: white;
}

.sides {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}

.side {
  background: #1f2937;
  padding: 16px;
  border-radius: 12px;
}

.pins {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 7px;
}

.pin {
  position: relative;
  background: #334155;
  border: 1px solid #64748b;
  border-radius: 5px;
  padding: 9px 5px;
  text-align: center;
  cursor: pointer;
  color: white;
  font-size: 12px;
}

.pin:hover, .pin:focus {
  outline: 2px solid #38bdf8;
  background: #2563eb;
}

.pin.power { background: #7f1d1d; }
.pin.gnd { background: #374151; }
.pin.analog { background: #854d0e; }
.pin.reset { background: #713f12; }

.pin small {
  display: block;
  color: #cbd5e1;
  margin-top: 3px;
}

#tooltip {
  display: none;
  position: fixed;
  z-index: 100;
  background: #020617;
  border: 1px solid #38bdf8;
  border-radius: 8px;
  padding: 14px;
  width: 240px;
  pointer-events: none;
  box-shadow: 0 5px 25px #0008;
  font-size: 13px;
}

#tooltip strong {
  color: #38bdf8;
  font-size: 17px;
}

.key {
  text-align: center;
  padding: 12px;
  background: #020617;
  border: 1px dashed #64748b;
  margin: 10px 0;
  color: #fbbf24;
}

@media(max-width:700px) {
  .sides { grid-template-columns: 1fr; }
}
</style>
</head>

<body>
<div class="container">

<h1>C2000 M.2 Control Card</h1>
<p>TMS320F28P650SK6 / TMS320F28P650DK6</p>

<div class="controls">
  <select id="revision">
    <option value="1.0">Hardware Rev. 1.0</option>
    <option value="1.1" selected>Hardware Rev. 1.1</option>
  </select>
  <input id="search" placeholder="Search GPIO / signal...">
</div>

<div class="sides">
  <div class="side">
    <h2>TOP SIDE – Odd pins</h2>
    <div id="top" class="pins"></div>
  </div>

  <div class="side">
    <h2>BOTTOM SIDE – Even pins</h2>
    <div id="bottom" class="pins"></div>
  </div>
</div>

<div id="tooltip"></div>
</div>

<script>
const topPins = [
[1,"GPIO4","GPIO","ePWM3A"],
[3,"GPIO3","GPIO","ePWM2B"],
[5,"GPIO2","GPIO","ePWM2A"],
[7,"GPIO1","GPIO","ePWM1B"],
[9,"GPIO0","GPIO","ePWM1A"],
[11,"GND","Power","Ground"],
[13,"GND","Power","Ground"],
[15,"GPIO90","GPIO","Revision 1.1: GPIO90 / Revision 1.0: GPIO86"],
[17,"GPIO85","GPIO","ePWM13A"],
[19,"GPIO25","GPIO","Digital I/O"],
[21,"GPIO80","GPIO","Digital I/O"],
[23,"GPIO78","GPIO","Digital I/O"],
[25,"GPIO73","GPIO","Digital I/O"],
[27,"GPIO71","GPIO","SCIB_RX"],
[29,"GPIO70","GPIO","SCIB_TX"],
[31,"GPIO47","GPIO","Digital I/O"],
[33,"GPIO42","GPIO","I2CA_SDA"],
[35,"GPIO69","GPIO","Digital I/O"],
[37,"GPIO43","GPIO","I2CA_SCL"],
[39,"GND","Power","Ground"],
[41,"A14/B14/C14","Analog","ADC"],
[43,"A15/B15/C15","Analog","ADC"],
[45,"B1/DACC","Analog","ADC / DAC"],
[47,"B6","Analog","ADC"],
[49,"B7","Analog","ADC"],
[51,"A6","Analog","ADC"],
[53,"A10","Analog","ADC"],
[55,"A11","Analog","ADC"],
[57,"GND","Power","Ground"],
[67,"XRSn","Reset","Reset input"],
[69,"3V3","Power","3.3 V supply"],
[71,"3V3","Power","3.3 V supply"],
[73,"3V3","Power","3.3 V supply"],
[75,"3V3","Power","3.3 V supply"]
];

const bottomPins = [
[2,"GPIO10","GPIO","ePWM6A"],
[4,"GPIO11","GPIO","ePWM6B"],
[6,"GPIO12","GPIO","ePWM7A"],
[8,"GPIO13","GPIO","ePWM7B"],
[10,"GPIO14","GPIO","ePWM8A"],
[12,"GPIO15","GPIO","ePWM8B"],
[14,"GND","Power","Ground"],
[16,"GPIO92","GPIO","I2CA_SCL"],
[18,"GPIO91","GPIO","I2CA_SDA"],
[20,"GPIO61","GPIO","Digital I/O"],
[22,"GPIO62","GPIO","eQEP_3A"],
[24,"GPIO63","GPIO","eQEP_3B"],
[26,"GPIO64","GPIO","eQEP_3S"],
[28,"GPIO65","GPIO","eQEP_3I"],
[30,"GPIO66","GPIO","Digital I/O"],
[32,"GPIO60","GPIO","Digital I/O"],
[34,"GPIO59","GPIO","CANA_TX"],
[36,"GPIO58","GPIO","CANA_RX"],
[38,"GPIO41","GPIO","Digital I/O"],
[40,"GND","Power","Ground"],
[42,"REF_3V0","Analog","3.0 V reference output"],
[44,"C6","Analog","ADC"],
[46,"C5","Analog","ADC"],
[48,"C4","Analog","ADC"],
[50,"A3","Analog","ADC"],
[52,"A2","Analog","ADC"],
[54,"A1","Analog","ADC"],
[56,"A0/DACA","Analog","ADC / DAC"],
[58,"GND","Power","Ground"],
[68,"GND","Power","Ground"],
[70,"GND","Power","Ground"],
[72,"GND","Power","Ground"],
[74,"GND","Power","Ground"]
];

function render() {
  const rev = document.getElementById("revision").value;
  const search = document.getElementById("search").value.toLowerCase();

  function draw(data, target) {
    document.getElementById(target).innerHTML = "";

    data.forEach(([num, signal, type, fn]) => {
      if (num === 15 && rev === "1.0") {
        signal = "GPIO86";
      }

      const content = `${num} ${signal} ${type} ${fn}`;

      if (!content.toLowerCase().includes(search)) return;

      const pin = document.createElement("button");
      pin.className = "pin " + (
        type === "Power" ? "power" :
        type === "Analog" ? "analog" :
        type === "Reset" ? "reset" : ""
      );

      pin.innerHTML = `${num}<small>${signal}</small>`;

      pin.dataset.info = JSON.stringify({
        number: num,
        signal, type, fn, revision: rev
      });

      pin.addEventListener("mouseenter", showTooltip);
      pin.addEventListener("mousemove", moveTooltip);
      pin.addEventListener("mouseleave", hideTooltip);
      pin.addEventListener("focus", showTooltip);
      pin.addEventListener("blur", hideTooltip);

      document.getElementById(target).appendChild(pin);
    });
  }

  draw(topPins, "top");
  draw(bottomPins, "bottom");
}

const tooltip = document.getElementById("tooltip");

function showTooltip(e) {
  const d = JSON.parse(e.currentTarget.dataset.info);
  tooltip.innerHTML = `
    <strong>Pin ${d.number}: ${d.signal}</strong><hr>
    <b>Type:</b> ${d.type}<br>
    <b>Function:</b> ${d.fn}<br>
    <b>Revision:</b> ${d.revision}
  `;
  tooltip.style.display = "block";
  moveTooltip(e);
}

function moveTooltip(e) {
  tooltip.style.left = Math.min(e.clientX + 15, innerWidth - 265) + "px";
  tooltip.style.top = Math.min(e.clientY + 15, innerHeight - 140) + "px";
}

function hideTooltip() {
  tooltip.style.display = "none";
}

document.getElementById("revision").addEventListener("change", render);
document.getElementById("search").addEventListener("input", render);

render();
</script>
</body>
</html>
