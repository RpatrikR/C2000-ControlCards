
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C2000 Control Card - M.2 Pinout</title>

<style>
:root {
  --bg: #111827;
  --panel: #1f2937;
  --text: #e5e7eb;
  --muted: #94a3b8;
  --blue: #38bdf8;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 30px 18px;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.container {
  max-width: 1450px;
  margin: auto;
}

header {
  margin-bottom: 25px;
}

h1 {
  margin-bottom: 6px;
  font-size: 28px;
}

.subtitle {
  color: var(--muted);
  font-size: 14px;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin: 25px 0;
}

select, input {
  padding: 11px 14px;
  border-radius: 6px;
  border: 1px solid #475569;
  background: var(--panel);
  color: white;
  font-size: 14px;
}

input {
  flex: 1;
  min-width: 200px;
}

.connector-wrapper {
  background: #0b1220;
  border: 1px solid #374151;
  border-radius: 12px;
  padding: 20px;
  overflow-x: auto;
}

.connector {
  min-width: 1050px;
  max-width: 1300px;
  margin: auto;
  background: #1a2638;
  padding: 18px;
  border-radius: 8px;
  border: 1px solid #475569;
}

.connector-title {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  letter-spacing: 2px;
  margin-bottom: 18px;
}

.side {
  margin-bottom: 7px;
}

.side-label {
  color: #cbd5e1;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 1.5px;
  margin-bottom: 7px;
}

.pins {
  display: grid;
  grid-template-columns: repeat(38, minmax(0, 1fr));
  gap: 3px;
  width: 100%;
}

/* PIN CONTACTS */

.pin {
  height: 52px;
  min-width: 0;
  border: 1px solid;
  border-radius: 2px;
  padding: 0;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: bold;
  transition: 0.12s;
}

/* GPIO - GREEN */
.pin.gpio {
  background: #b7d9bd;
  border-color: #78aa82;
  color: #173d20;
}

/* GND - BLUE */
.pin.gnd {
  background: #b8d3ed;
  border-color: #82acd4;
  color: #173b5c;
}

/* 3V3 - RED */
.pin.power {
  background: #edbcbc;
  border-color: #d99595;
  color: #652727;
}

/* ANALOG / ADC - YELLOW */
.pin.analog {
  background: #f1dfaa;
  border-color: #d4bd76;
  color: #594719;
}

/* RESET - GREY */
.pin.reset {
  background: #d0d3d8;
  border-color: #9ca3af;
  color: #374151;
}

.pin:hover,
.pin:focus-visible {
  filter: brightness(1.12);
  border: 2px solid white;
  outline: none;
  transform: translateY(-3px);
  z-index: 3;
}

.pin-gap {
  height: 52px;
  background: #0b1220;
  border: 1px dashed #334155;
  border-radius: 2px;
}

.key-area {
  height: 14px;
  background: #080d16;
  border-top: 1px solid #475569;
  border-bottom: 1px solid #475569;
  margin: 8px 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #94a3b8;
  font-size: 9px;
  letter-spacing: 2px;
}

/* LEGEND */

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  margin-top: 20px;
  justify-content: center;
  color: var(--muted);
  font-size: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
}

.legend-color {
  width: 12px;
  height: 12px;
  border-radius: 2px;
}

/* TOOLTIP */

#tooltip {
  display: none;
  position: fixed;
  z-index: 1000;
  width: 260px;
  background: #020617;
  border: 1px solid var(--blue);
  border-radius: 8px;
  padding: 13px;
  pointer-events: none;
  box-shadow: 0 8px 30px #0009;
  font-size: 12px;
}

#tooltip strong {
  color: var(--blue);
  font-size: 16px;
}

/* MODAL */

#modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 2000;
  background: #000b;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-content {
  width: 100%;
  max-width: 440px;
  background: #1f2937;
  border: 1px solid #475569;
  border-radius: 12px;
  padding: 22px;
  box-shadow: 0 15px 50px #0009;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.modal-header h2 {
  color: var(--blue);
  font-size: 21px;
  margin: 0;
}

.close {
  background: transparent;
  color: white;
  border: none;
  font-size: 25px;
  cursor: pointer;
}

.detail-row {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  padding: 10px 0;
  border-bottom: 1px solid #374151;
  font-size: 13px;
}

.detail-row span:first-child {
  color: var(--muted);
}

.detail-row span:last-child {
  text-align: right;
  font-weight: bold;
}

.warning {
  margin-top: 22px;
  padding: 12px;
  background: #422006;
  border: 1px solid #92400e;
  border-radius: 6px;
  color: #fcd34d;
  font-size: 12px;
  text-align: center;
}

footer {
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  margin-top: 25px;
}

@media(max-width:600px) {
  body {
    padding: 15px 8px;
  }

  .connector-wrapper {
    padding: 8px;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>C2000 Control Card</h1>
  <div class="subtitle">
    Custom M.2 Key M Interface – P650xK6
  </div>
</header>

<div class="controls">

  <select id="revision">
    <option value="1.0">Hardware Revision 1.0</option>
    <option value="1.1" selected>Hardware Revision 1.1</option>
  </select>

  <input
    id="search"
    type="text"
    placeholder="Search pin, GPIO or signal..."
  >

</div>

<div class="connector-wrapper">

  <div class="connector">

    <div class="connector-title">
      M.2 CONNECTOR – CUSTOM PINOUT
    </div>

    <div class="side">
      <div class="side-label">
        TOP SIDE – ODD PINS
      </div>
      <div id="top" class="pins"></div>
    </div>

    <div class="key-area">
      M.2 CONNECTOR
    </div>

    <div class="side">
      <div class="side-label">
        BOTTOM SIDE – EVEN PINS
      </div>
      <div id="bottom" class="pins"></div>
    </div>

  </div>

</div>

<div class="legend">

  <div class="legend-item">
    <div class="legend-color" style="background:#b7d9bd"></div>
    GPIO / Digital
  </div>

  <div class="legend-item">
    <div class="legend-color" style="background:#b8d3ed"></div>
    GND
  </div>

  <div class="legend-item">
    <div class="legend-color" style="background:#edbcbc"></div>
    3V3
  </div>

  <div class="legend-item">
    <div class="legend-color" style="background:#f1dfaa"></div>
    Analog / ADC
  </div>

  <div class="legend-item">
    <div class="legend-color" style="background:#d0d3d8"></div>
    RESET
  </div>

</div>

<div class="warning">
  CUSTOM PINOUT – NOT M.2 STANDARD COMPATIBLE
</div>

<footer>
  C2000 Control Cards | P650xK6 | Interactive Pinout
</footer>

</div>

<div id="tooltip"></div>

<div id="modal">
  <div class="modal-content">

    <div class="modal-header">
      <h2 id="modal-title">Pin details</h2>
      <button class="close" onclick="closeModal()">&times;</button>
    </div>

    <div id="modal-details"></div>

  </div>
</div>

<script>

/* =====================================
   PIN DATABASE
   ===================================== */

const topPins = [
[1,"GPIO4","GPIO","ePWM3A"],
[3,"GPIO3","GPIO","ePWM2B"],
[5,"GPIO2","GPIO","ePWM2A"],
[7,"GPIO1","GPIO","ePWM1B"],
[9,"GPIO0","GPIO","ePWM1A"],
[11,"GND","Power","Ground"],
[13,"GND","Power","Ground"],
[15,"GPIO90","GPIO","GPIO86 on Rev. 1.0 / GPIO90 on Rev. 1.1"],
[17,"GPIO85","GPIO","ePWM13A"],
[19,"GPIO25","GPIO","Digital I/O"],
[21,"GPIO80","GPIO","Digital I/O"],
[23,"GPIO78","GPIO","Digital I/O"],
[25,"GPIO73","GPIO","Digital I/O"],
[27,"GPIO71","GPIO","SCIB_RX"],
[29,"GPIO70","GPIO","SCIB_TX"],
[31,"GPIO47","GPIO","Digital I/O"],
[33,"GPIO42","GPIO","I2CA_SDA"],
[35,"GPIO69","GPIO","Digital I/O"],
[37,"GPIO43","GPIO","I2CA_SCL"],
[39,"GND","Power","Ground"],
[41,"A14/B14/C14","Analog","ADC"],
[43,"A15/B15/C15","Analog","ADC"],
[45,"B1/DACC","Analog","ADC / DAC"],
[47,"B6","Analog","ADC"],
[49,"B7","Analog","ADC"],
[51,"A6","Analog","ADC"],
[53,"A10","Analog","ADC"],
[55,"A11","Analog","ADC"],
[57,"GND","Power","Ground"],
[67,"XRSn","Reset","Reset input"],
[69,"3V3","Power","3.3 V supply"],
[71,"3V3","Power","3.3 V supply"],
[73,"3V3","Power","3.3 V supply"],
[75,"3V3","Power","3.3 V supply"]
];

const bottomPins = [
[2,"GPIO10","GPIO","ePWM6A"],
[4,"GPIO11","GPIO","ePWM6B"],
[6,"GPIO12","GPIO","ePWM7A"],
[8,"GPIO13","GPIO","ePWM7B"],
[10,"GPIO14","GPIO","ePWM8A"],
[12,"GPIO15","GPIO","ePWM8B"],
[14,"GND","Power","Ground"],
[16,"GPIO92","GPIO","I2CA_SCL"],
[18,"GPIO91","GPIO","I2CA_SDA"],
[20,"GPIO61","GPIO","Digital I/O"],
[22,"GPIO62","GPIO","eQEP_3A"],
[24,"GPIO63","GPIO","eQEP_3B"],
[26,"GPIO64","GPIO","eQEP_3S"],
[28,"GPIO65","GPIO","eQEP_3I"],
[30,"GPIO66","GPIO","Digital I/O"],
[32,"GPIO60","GPIO","Digital I/O"],
[34,"GPIO59","GPIO","CANA_TX"],
[36,"GPIO58","GPIO","CANA_RX"],
[38,"GPIO41","GPIO","Digital I/O"],
[40,"GND","Power","Ground"],
[42,"REF_3V0","Analog","3.0 V reference output"],
[44,"C6","Analog","ADC"],
[46,"C5","Analog","ADC"],
[48,"C4","Analog","ADC"],
[50,"A3","Analog","ADC"],
[52,"A2","Analog","ADC"],
[54,"A1","Analog","ADC"],
[56,"A0/DACA","Analog","ADC"],
[58,"GND","Power","Ground"],
[68,"GND","Power","Ground"],
[70,"GND","Power","Ground"],
[72,"GND","Power","Ground"],
[74,"GND","Power","Ground"]
];

/* =====================================
   PIN COLOR CLASSIFICATION
   ===================================== */

function getPinClass(signal, type) {

  if(signal === "GND") return "gnd";
  if(signal === "3V3") return "power";
  if(type === "Analog") return "analog";
  if(type === "Reset") return "reset";

  return "gpio";
}

/* =====================================
   RENDER CONNECTOR
   ===================================== */

function render() {

  const rev =
    document.getElementById("revision").value;

  const search =
    document.getElementById("search")
      .value.toLowerCase();

  function draw(data, target, parity) {

    const container =
      document.getElementById(target);

    container.innerHTML = "";

    const count = parity === 1 ? 38 : 37;

    for(let i = 0; i < count; i++) {

      const pinNumber = i * 2 + parity;

      const pinData =
        data.find(p => p[0] === pinNumber);

      if(!pinData) {

        const gap = document.createElement("div");
        gap.className = "pin-gap";
        container.appendChild(gap);
        continue;
      }

      let [num, signal, type, fn] = pinData;

      if(num === 15) {
        signal = rev === "1.0"
          ? "GPIO86"
          : "GPIO90";
      }

      const content =
        `${num} ${signal} ${type} ${fn}`;

      if(!content.toLowerCase().includes(search)) {

        const gap = document.createElement("div");
        gap.className = "pin-gap";
        container.appendChild(gap);
        continue;
      }

      const pin = document.createElement("button");

      pin.className = "pin " + getPinClass(signal, type);

      // Display only physical connector pin number
      pin.textContent = num;

      pin.dataset.info = JSON.stringify({
        number: num,
        signal,
        type,
        fn,
        revision: rev
      });

      pin.title = `Pin ${num}`;

      pin.addEventListener("mouseenter", showTooltip);
      pin.addEventListener("mousemove", moveTooltip);
      pin.addEventListener("mouseleave", hideTooltip);

      pin.addEventListener("focus", showTooltip);
      pin.addEventListener("blur", hideTooltip);

      pin.addEventListener("click", () => {
        hideTooltip();
        openModal(pin.dataset.info);
      });

      container.appendChild(pin);
    }
  }

  draw(topPins, "top", 1);
  draw(bottomPins, "bottom", 2);
}

/* =====================================
   TOOLTIP
   ===================================== */

const tooltip =
  document.getElementById("tooltip");

function showTooltip(e) {

  const d =
    JSON.parse(e.currentTarget.dataset.info);

  tooltip.innerHTML = `
    <strong>Pin ${d.number}: ${d.signal}</strong>
    <hr>
    <b>Type:</b> ${d.type}<br>
    <b>Function:</b> ${d.fn}<br>
    <b>Revision:</b> ${d.revision}
  `;

  tooltip.style.display = "block";
  moveTooltip(e);
}

function moveTooltip(e) {

  const x = Math.min(
    e.clientX + 15,
    window.innerWidth - 275
  );

  const y = Math.min(
    e.clientY + 15,
    window.innerHeight - 130
  );

  tooltip.style.left = Math.max(5, x) + "px";
  tooltip.style.top = Math.max(5, y) + "px";
}

function hideTooltip() {
  tooltip.style.display = "none";
}

/* =====================================
   DETAIL MODAL
   ===================================== */

function openModal(json) {

  const d = JSON.parse(json);

  document.getElementById("modal-title").textContent =
    `Pin ${d.number} – ${d.signal}`;

  document.getElementById("modal-details").innerHTML = `
    <div class="detail-row">
      <span>Connector pin</span>
      <span>${d.number}</span>
    </div>

    <div class="detail-row">
      <span>Signal / GPIO</span>
      <span>${d.signal}</span>
    </div>

    <div class="detail-row">
      <span>Type</span>
      <span>${d.type}</span>
    </div>

    <div class="detail-row">
      <span>Function</span>
      <span>${d.fn}</span>
    </div>

    <div class="detail-row">
      <span>Hardware revision</span>
      <span>${d.revision}</span>
    </div>
  `;

  document.getElementById("modal").style.display =
    "flex";
}

function closeModal() {
  document.getElementById("modal").style.display =
    "none";
}

document.getElementById("modal")
  .addEventListener("click", e => {
    if(e.target.id === "modal") closeModal();
  });

/* =====================================
   CONTROLS
   ===================================== */

document.getElementById("revision")
  .addEventListener("change", render);

document.getElementById("search")
  .addEventListener("input", render);

document.addEventListener("keydown", e => {
  if(e.key === "Escape") closeModal();
});

/* INITIALIZE */

render();

</script>

</body>
</html>
